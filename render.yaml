services:
  - type: web
    name: anonchat
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run build && npx prisma db seed
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
